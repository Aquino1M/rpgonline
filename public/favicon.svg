<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142c4c"/>
      <stop offset="60%" stop-color="#091424"/>
      <stop offset="100%" stop-color="#040a12"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo arredondado moderno -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="102" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Anel Mágico / Runa de Asterra -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-dasharray="16 8" filter="url(#glow)" opacity="0.85"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6"/>

  <!-- 4 Pontas Rúnicas Cardeais -->
  <polygon points="256,56 266,78 256,88 246,78" fill="url(#goldGrad)"/>
  <polygon points="256,456 266,434 256,424 246,434" fill="url(#goldGrad)"/>
  <polygon points="56,256 78,266 88,256 78,246" fill="url(#goldGrad)"/>
  <polygon points="456,256 434,266 424,256 434,246" fill="url(#goldGrad)"/>

  <!-- Lâminas Cruzadas -->
  <g filter="url(#glow)">
    <!-- Espada Central Celestial -->
    <!-- Lâmina -->
    <path d="M 256 90 L 272 310 L 256 345 L 240 310 Z" fill="url(#bladeGrad)"/>
    <line x1="256" y1="92" x2="256" y2="340" stroke="#f0f9ff" stroke-width="3" stroke-linecap="round"/>

    <!-- Guarda da Espada -->
    <path d="M 180 325 Q 256 340 332 325 L 332 342 Q 256 360 180 342 Z" fill="url(#goldGrad)"/>
    <!-- Joia Central -->
    <polygon points="256,324 266,336 256,348 246,336" fill="#38bdf8"/>

    <!-- Cabo e Pomo -->
    <rect x="250" y="348" width="12" height="52" rx="4" fill="#334155"/>
    <line x1="250" y1="358" x2="262" y2="358" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="250" y1="370" x2="262" y2="370" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="250" y1="382" x2="262" y2="382" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="256" cy="416" r="14" fill="url(#goldGrad)"/>
    <circle cx="256" cy="416" r="6" fill="#38bdf8"/>
  </g>

  <!-- Escudo / Asas de Proteção Etéreas -->
  <path d="M 140 210 Q 256 160 372 210 Q 360 300 256 370 Q 152 300 140 210 Z" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.45"/>
</svg>
